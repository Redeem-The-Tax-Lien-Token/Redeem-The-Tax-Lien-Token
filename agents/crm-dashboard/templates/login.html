<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Wholesale CRM</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#fff;border-radius:10px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    h1{font-size:20px;font-weight:700;text-align:center;margin-bottom:6px;color:#1a1a2e}
    .sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:24px}
    label{display:block;font-size:12px;font-weight:500;color:#475569;margin-bottom:4px}
    input{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:5px;font-size:14px;margin-bottom:14px}
    input:focus{outline:2px solid #2563eb;border-color:transparent}
    button{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:5px;font-size:14px;font-weight:600;cursor:pointer}
    button:hover{background:#1d4ed8}
    .flash{padding:10px;border-radius:5px;margin-bottom:14px;font-size:13px;background:#fee2e2;color:#991b1b;text-align:center}
  </style>
</head>
<body>
  <div class="card">
    <h1>Wholesale CRM</h1>
    <p class="sub">Indianapolis, IN</p>
    {% if flash %}
      <div class="flash">{{ flash.msg }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>

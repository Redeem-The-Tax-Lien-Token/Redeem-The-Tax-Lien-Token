<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wholesale CRM{% endblock %}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px}
    a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}
    nav{background:#1a1a2e;color:#fff;padding:0 24px;display:flex;align-items:center;height:48px;gap:4px}
    nav .brand{font-weight:700;font-size:15px;color:#fff;margin-right:16px;white-space:nowrap}
    nav a{color:#94a3b8;padding:6px 10px;border-radius:4px;font-size:13px}
    nav a:hover,nav a.active{color:#fff;background:rgba(255,255,255,.1);text-decoration:none}
    nav .spacer{flex:1}
    .container{max-width:1280px;margin:0 auto;padding:20px 24px}
    .card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .card-title{font-size:15px;font-weight:600;color:#1a1a2e}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;color:#64748b;background:#f8fafc;border-bottom:2px solid #e2e8f0}
    td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
    tr:hover td{background:#fafbff}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
    .s-new{background:#e2e8f0;color:#475569}
    .s-traced{background:#dbeafe;color:#1d4ed8}
    .s-contacted{background:#fef9c3;color:#854d0e}
    .s-hot{background:#fee2e2;color:#991b1b}
    .s-warm{background:#ffedd5;color:#9a3412}
    .s-cold{background:#e0f2fe;color:#0369a1}
    .s-dnc{background:#fce7f3;color:#9d174d}
    .s-under_contract{background:#dcfce7;color:#166534}
    .s-closed{background:#d1fae5;color:#065f46}
    .s-dead{background:#f1f5f9;color:#94a3b8}
    .btn{display:inline-block;padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .15s}
    .btn:hover{opacity:.85;text-decoration:none}
    .btn-primary{background:#2563eb;color:#fff}
    .btn-danger{background:#dc2626;color:#fff}
    .btn-secondary{background:#e2e8f0;color:#1a1a2e}
    .btn-sm{padding:4px 10px;font-size:12px}
    .btn-xs{padding:2px 7px;font-size:11px}
    input[type=text],input[type=password],input[type=email],input[type=number],select,textarea{
      width:100%;padding:7px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;color:#1a1a2e}
    input:focus,select:focus,textarea:focus{outline:2px solid #2563eb;border-color:transparent}
    label{display:block;font-size:12px;font-weight:500;color:#475569;margin-bottom:4px}
    .form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:12px}
    .form-group{margin-bottom:12px}
    .flash{padding:10px 14px;border-radius:5px;margin-bottom:14px;font-size:13px}
    .flash-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
    .flash-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
    .stat-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;color:#64748b;margin-bottom:4px}
    .stat-value{font-size:24px;font-weight:700;color:#1a1a2e}
    .stat-sub{font-size:12px;color:#64748b;margin-top:2px}
    .dir-out{color:#2563eb}
    .dir-in{color:#16a34a}
    .empty{text-align:center;padding:40px;color:#94a3b8}
    .text-muted{color:#94a3b8}
    .text-right{text-align:right}
    .mt-8{margin-top:8px}
    .mt-16{margin-top:16px}
    h2{font-size:18px;font-weight:700;margin-bottom:16px}
    h3{font-size:14px;font-weight:600;margin-bottom:10px}
  </style>
</head>
<body>
<nav>
  <span class="brand">Wholesale CRM</span>
  <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Pipeline</a>
  <a href="/deals" {% if request.url.path == '/deals' %}class="active"{% endif %}>Deals</a>
  <a href="/buyers" {% if request.url.path == '/buyers' %}class="active"{% endif %}>Buyers</a>
  <a href="/outreach" {% if request.url.path.startswith('/outreach') %}class="active"{% endif %}>Outreach</a>
  <a href="/kpi" {% if request.url.path == '/kpi' %}class="active"{% endif %}>KPIs</a>
  <a href="/sms/send" {% if request.url.path == '/sms/send' %}class="active"{% endif %}>Send SMS</a>
  <div class="spacer"></div>
  <a href="/logout" style="color:#94a3b8">{{ user }} &nbsp;&#x2715;</a>
</nav>
<div class="container">
  {% if flash %}
    <div class="flash flash-{{ flash.cat }}">{{ flash.msg }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
